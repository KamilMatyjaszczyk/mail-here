[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mailklient"
version = "0.1.0"
description = "En lett og modulær desktop e-postklient for Linux."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "keyring>=25.0",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mailklient = "mailklient.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mailklient.database" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
