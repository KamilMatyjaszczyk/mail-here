[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpMail"
version = "0.1.0"
description = "A lightweight, modular desktop email client for Linux."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "IMAPClient>=3.0.1,<4",
    "keyring>=25.0",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
]

[project.scripts]
mcpMail = "mailklient.main:main"
mcpMail-launcher = "mailklient.install_launcher:main"
# Keep existing terminal commands and shortcuts working after the rename.
mailklient = "mailklient.main:main"
mailklient-launcher = "mailklient.install_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mailklient.database" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
